<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf3e7"><title>Доббль — найди одинаковые картинки</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><div class="decor decor-a" aria-hidden="true">✦</div><div class="decor decor-b" aria-hidden="true">✧</div><div class="decor decor-c" aria-hidden="true">✦</div>
<header><span class="brand">доббль<span class="brand-dot">•</span></span><button id="sound" class="sound" aria-label="Выключить звуки" aria-pressed="true">Звук вкл.</button></header>
<section id="start" class="screen intro"><span class="eyebrow">СМОТРИ · НАХОДИ · НАЗЫВАЙ</span><h1>Доббль<span class="title-star" aria-hidden="true">✦</span></h1><p class="subtitle">Найди одинаковые картинки!</p><div class="cover" aria-hidden="true"><div class="mini-card mint"><img src="assets/giraffe.png" alt=""><img src="assets/lemon.png" alt=""><img src="assets/sofa.png" alt=""></div><div class="mini-card peach"><img src="assets/rooster.png" alt=""><img src="assets/lemon.png" alt=""><img src="assets/peas.png" alt=""></div><span class="cover-spark">✧</span></div><button id="play" class="primary" disabled>Загружаем картинки…</button><p class="hint" id="load-status">8 маленьких открытий</p></section>
<section id="game" class="screen game" hidden><div class="game-heading"><div><span class="eyebrow" id="round-label">РАУНД 1 ИЗ 8</span><h2>Что есть в обоих кругах?</h2></div><div id="progress" class="progress" aria-hidden="true"></div></div><div class="board"><div class="card card-left" aria-label="Левый круг"></div><span class="between" aria-hidden="true">✧</span><div class="card card-right" aria-label="Правый круг"></div></div><p id="feedback" class="feedback" role="status" aria-live="polite">Найди пару и назови её вслух</p></section>
<section id="finish" class="screen finish" hidden><div class="finish-stars" aria-hidden="true">✧ <span>★</span> ✧</div><span class="eyebrow">ВСЕ ПАРЫ НАЙДЕНЫ</span><h2>Отлично поиграли!</h2><p class="subtitle">Ещё немного маленьких открытий?</p><button id="again" class="primary">Играть ещё раз</button></section><div id="confetti" aria-hidden="true"></div><footer>Две картинки — одно слово</footer></main><script src="rounds.js"></script><script src="game.js"></script></body></html>
