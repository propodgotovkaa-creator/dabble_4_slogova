<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf3e7"><title>Найди одинаковые картинки</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><main id="app"><div class="decor decor-a" aria-hidden="true">✦</div><div class="decor decor-b" aria-hidden="true">✧</div><div class="decor decor-c" aria-hidden="true">✦</div>
<header><button id="sound" class="sound" aria-label="Выключить звуки" aria-pressed="true">Звук вкл.</button></header>
<section id="start" class="screen intro intro-new"><div class="welcome-scene"><div class="welcome-orbit" aria-hidden="true"></div><div class="welcome-art art-giraffe" aria-hidden="true"><img src="assets/giraffe.png" alt=""></div><div class="welcome-art art-ram" aria-hidden="true"><img src="assets/ram.png" alt=""></div><div class="welcome-art art-lemon" aria-hidden="true"><img src="assets/lemon.png" alt=""></div><div class="welcome-art art-castle" aria-hidden="true"><img src="assets/castle.png" alt=""></div><span class="welcome-spark spark-one" aria-hidden="true">✦</span><span class="welcome-spark spark-two" aria-hidden="true">✧</span><div class="welcome-copy"><span class="eyebrow">МАЛЕНЬКАЯ ИГРА НА ВНИМАНИЕ</span><h1 class="welcome-title">Найди одинаковые<br><span>картинки!</span></h1><p class="welcome-note">Смотри внимательно.<br>Найди пару и назови её вслух.</p><button id="play" class="primary" disabled>Загружаем картинки…</button><p class="hint" id="load-status">8 маленьких открытий</p></div></div></section>
<section id="game" class="screen game" hidden><div class="game-heading"><div><span class="eyebrow" id="round-label">РАУНД 1 ИЗ 8</span><h2>Что есть в обоих кругах?</h2></div><div id="progress" class="progress" aria-hidden="true"></div></div><div class="board"><div class="card card-left" aria-label="Левый круг"></div><span class="between" aria-hidden="true">✧</span><div class="card card-right" aria-label="Правый круг"></div></div><p id="feedback" class="feedback" role="status" aria-live="polite">Найди пару и назови её вслух</p></section>
<section id="finish" class="screen finish" hidden><div class="finish-stars" aria-hidden="true">✧ <span>★</span> ✧</div><span class="eyebrow">ВСЕ ПАРЫ НАЙДЕНЫ</span><h2>Отлично поиграли!</h2><p class="subtitle">Ещё немного маленьких открытий?</p><button id="again" class="primary">Играть ещё раз</button></section><div id="confetti" aria-hidden="true"></div></main><script src="rounds.js?v=2"></script><script src="game.js?v=2"></script></body></html>
